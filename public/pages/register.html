<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta · Foundy</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="container page"><div class="card form auth-card"><p class="eyebrow">PRIMEIRO ACESSO</p><h1>Criar conta</h1><p class="muted">Escolha como você participa do Foundy.</p><div class="account-choice"><label class="choice"><input type="radio" name="accountType" value="student" checked><span><b>Sou aluno</b><small>Preciso informar CGM e turma.</small></span></label><label class="choice"><input type="radio" name="accountType" value="team"><span><b>Sou da equipe</b><small>Cadastro protegido por código da equipe.</small></span></label></div><form data-action="/api/auth/register"><input type="hidden" name="accountType" id="accountTypeMirror" value="student"><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div id="studentFields"><div class="grid grid-2"><div class="field"><label>CGM</label><input name="cgm" required></div><div class="field"><label>Turma</label><input name="turma" required></div></div></div><div id="teamFields" class="hidden"><div class="field"><label>Código da equipe</label><input name="teamCode" autocomplete="off"><p class="muted small">Se você faz parte da equipe e não possui o código, peça ao administrador.</p></div></div><div class="field"><label>Senha</label><input name="password" type="password" minlength="6" required></div><button class="btn btn-primary">Criar conta</button></form><p class="muted"><a href="/">Voltar</a> · Já tem conta? <a href="/pages/login.html">Entrar</a></p></div></main><div class="toast hidden"></div><script src="/js/app.js"></script><script src="/js/auth.js"></script><script>document.querySelectorAll('input[name="accountType"]').forEach(x=>x.addEventListener('change',()=>document.querySelector('#accountTypeMirror').value=document.querySelector('input[name="accountType"]:checked').value));</script></body></html>
