<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suporte · Foundy</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="container page"><section id="studentSupport"><div class="page-title"><p class="eyebrow">ATENDIMENTO</p><h1>Suporte</h1><p class="muted">Envie sua dúvida para os administradores e acompanhe a resposta.</p></div><div class="card form"><h2>Nova dúvida</h2><form id="supportForm"><div class="field"><label>Assunto</label><input id="subject" name="subject" required></div><div class="field"><label>Mensagem</label><textarea id="message" name="message" required placeholder="Explique sua dúvida..."></textarea></div><button class="btn btn-primary">Enviar chamado</button></form></div><section class="section support-history"><h2>Meus chamados</h2><div id="studentTickets" class="grid"></div></section></section><section id="adminSupport" class="hidden"><div class="page-title"><p class="eyebrow">ATENDIMENTO ADMINISTRATIVO</p><h1>Chamados de suporte</h1><p class="muted">Responda alunos e equipe. Um chamado só pode ser concluído depois de receber uma resposta.</p></div><div id="adminTickets" class="grid"></div></section></main><div class="toast hidden"></div><script src="/js/app.js"></script><script src="/js/forms.js"></script><script src="/js/support.js"></script></body></html>
