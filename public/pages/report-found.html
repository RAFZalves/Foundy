<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar encontrado · Foundy</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="container page"><div class="card form"><p class="eyebrow">EQUIPE</p><h1>Registrar item encontrado</h1><p class="muted">Use este formulário para cadastrar algo encontrado na escola.</p><form id="itemForm"><input type="hidden" name="type" value="found"><div class="field"><label>O que foi encontrado?</label><input name="title" required></div><div class="field"><label>Descrição</label><textarea name="description" required></textarea></div><div class="grid grid-2"><div class="field"><label>Cor</label><input name="color"></div><div class="field"><label>Sala</label><input name="room"></div></div><div class="field"><label>Local</label><input name="location"></div><div class="field"><label>Detalhes adicionais</label><textarea name="details"></textarea></div><div class="field"><label>Foto (opcional)</label><input name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div><button class="btn btn-primary">Registrar encontrado</button></form></div></main><div class="toast hidden"></div><script src="/js/app.js"></script><script src="/js/forms.js"></script></body></html>
