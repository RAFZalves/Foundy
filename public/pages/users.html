<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários · Foundy</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="container page"><div class="page-title"><p class="eyebrow">ADMINISTRAÇÃO</p><h1>Usuários</h1><p class="muted">Cadastro e gerenciamento de alunos, equipe e administradores.</p></div><section id="cadastro" class="card form admin-section"><h2>Cadastrar usuário</h2><form id="createUserForm"><div class="grid grid-2"><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Perfil</label><select name="role"><option value="student">Aluno</option><option value="cleaning">Equipe</option><option value="admin">Administrador</option></select></div><div class="field"><label>Senha</label><input name="password" type="password" minlength="6" required></div><div class="field"><label>CGM</label><input name="cgm"></div><div class="field"><label>Turma</label><input name="turma"></div></div><button class="btn btn-primary">Cadastrar</button></form></section><section class="admin-section"><div class="search-field"><span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></span><input id="userSearch" placeholder="Pesquisar por nome, CGM, turma ou email..."></div><div class="card form table-wrap"><table class="table"><thead><tr><th>Nome</th><th>CGM</th><th>Turma</th><th>Email</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead><tbody id="users"></tbody></table></div></section></main><div id="userModal" class="modal hidden"><div class="modal-card card form"><div class="modal-head"><div><p class="eyebrow">EDIÇÃO</p><h2 id="userModalTitle">Editar usuário</h2></div><button id="closeUserModal" class="icon-button" type="button">×</button></div><form id="editUserForm"><div class="grid grid-2"><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Perfil</label><select name="role"><option value="student">Aluno</option><option value="cleaning">Equipe</option><option value="admin">Administrador</option></select></div><div class="field"><label>CGM</label><input name="cgm"></div><div class="field"><label>Turma</label><input name="turma"></div><div class="field"><label>Nova senha</label><input name="password" type="password" minlength="6" placeholder="Deixe vazio para manter"></div></div><button class="btn btn-primary">Salvar alterações</button></form></div></div><div class="toast hidden"></div><script src="/js/app.js"></script><script src="/js/users.js"></script></body></html>
